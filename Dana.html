<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧮 Matemáticas Primaria - TODAS las Operaciones</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Comic Sans MS', cursive; 
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh; padding: 20px;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { 
            text-align: center; color: #d63384; font-size: 3em; 
            margin: 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }
        .stats { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); 
            gap: 20px; margin: 20px 0;
        }
        .stat { 
            background: white; padding: 20px; border-radius: 20px; 
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .stat-num { font-size: 2.5em; font-weight: bold; color: #28a745; }
        
        .tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 30px 0; }
        .tab { 
            padding: 15px 25px; background: white; border: none; 
            border-radius: 25px; cursor: pointer; font-size: 1.2em; 
            font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        .tab.active { background: #007bff; color: white; transform: translateY(-3px); }
        
        .content { display: none; background: white; padding: 30px; border-radius: 25px; margin: 20px 0; box-shadow: 0 15px 40px rgba(0,0,0,0.1); }
        .content.active { display: block; }
        
        .exercise { text-align: center; padding: 30px; background: #f8f9ff; border-radius: 20px; margin: 20px 0; }
        .question { font-size: 4em; font-weight: bold; color: #007bff; margin: 30px 0; min-height: 100px; display: flex; align-items: center; justify-content: center; }
        input[type="number"] { 
            font-size: 3em; padding: 20px; width: 200px; border: 5px solid #ddd; 
            border-radius: 15px; text-align: center; font-family: inherit; margin: 20px;
        }
        input[type="number"]:focus { border-color: #28a745; outline: none; box-shadow: 0 0 15px rgba(40,167,69,0.3); }
        .btn { 
            padding: 20px 40px; font-size: 1.5em; border: none; border-radius: 20px; 
            cursor: pointer; margin: 10px; font-weight: bold; font-family: inherit;
            transition: all 0.3s;
        }
        .btn-success { background: #28a745; color: white; }
        .btn-success:hover { background: #218838; transform: scale(1.05); }
        .btn-primary { background: #007bff; color: white; }
        .btn-primary:hover { background: #0056b3; transform: scale(1.05); }
        .correct { border-color: #28a745 !important; background: #d4edda !important; animation: bounce 0.6s; }
        .wrong { border-color: #dc3545 !important; background: #f8d7da !important; }
        @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
        
        .steps { margin-top: 30px; text-align: left; }
        .step { 
            background: linear-gradient(135deg, #e3f2fd, #bbdefb); padding: 20px; 
            margin: 15px 0; border-radius: 15px; border-left: 6px solid #2196f3;
        }
        .step-num { font-size: 2em; color: #007bff; font-weight: bold; margin-right: 15px; }
        
        .progress { background: #e9ecef; height: 25px; border-radius: 12px; margin: 30px 0; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #28a745, #007bff); transition: width 0.5s; }
        
        @media (max-width: 768px) {
            .question { font-size: 2.5em; }
            input[type="number"] { font-size: 2em; width: 150px; padding: 15px; }
            .tabs { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 ¡Matemáticas Divertidas!</h1>
        <p style="text-align: center; font-size: 1.5em; color: #6c757d; margin-bottom: 20px;">
            Para niños de PRIMARIA - ¡Todas las operaciones! 🥳
        </p>

        <div class="stats">
            <div class="stat">
                <div class="stat-num" id="score">0</div>
                <div>⭐ Aciertos</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="accuracy">0%</div>
                <div>🎯 Precisión</div>
            </div>
            <div class="stat">
                <div class="stat-num" id="total">0</div>
                <div>📊 Total</div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('suma')">➕ Sumas</button>
            <button class="tab" onclick="showTab('resta')">➖ Restas</button>
            <button class="tab" onclick="showTab('multiplicar')">✖️ Multiplicar</button>
            <button class="tab" onclick="showTab('dividir')">➗ Dividir</button>
        </div>

        <!-- SUMAS -->
        <div id="suma" class="content active">
            <div class="exercise">
                <div class="question" id="suma-question">¡Empezar!</div>
                <input type="number" id="suma-answer" min="0">
                <br>
                <button class="btn btn-success" onclick="checkSuma()">✅ Verificar</button>
                <button class="btn btn-primary" onclick="newSuma()">🔄 Nuevo</button>
            </div>
            <div id="suma-steps" class="steps" style="display: none;"></div>
        </div>

        <!-- RESTAS -->
        <div id="resta" class="content">
            <div class="exercise">
                <div class="question" id="resta-question"></div>
                <input type="number" id="resta-answer" min="0">
                <br>
                <button class="btn btn-success" onclick="checkResta()">✅ Verificar</button>
                <button class="btn btn-primary" onclick="newResta()">🔄 Nuevo</button>
            </div>
            <div id="resta-steps" class="steps" style="display: none;"></div>
        </div>

        <!-- MULTIPLICAR -->
        <div id="multiplicar" class="content">
            <div class="exercise">
                <div class="question" id="multiplicar-question"></div>
                <input type="number" id="multiplicar-answer" min="0">
                <br>
                <button class="btn btn-success" onclick="checkMultiplicar()">✅ Verificar</button>
                <button class="btn btn-primary" onclick="newMultiplicar()">🔄 Nuevo</button>
            </div>
            <div id="multiplicar-steps" class="steps" style="display: none;"></div>
        </div>

        <!-- DIVIDIR -->
        <div id="dividir" class="content">
            <div class="exercise">
                <div class="question" id="dividir-question"></div>
                <input type="number" id="dividir-answer" min="0">
                <br>
                <button class="btn btn-success" onclick="checkDividir()">✅ Verificar</button>
                <button class="btn btn-primary" onclick="newDividir()">🔄 Nuevo</button>
            </div>
            <div id="dividir-steps" class="steps" style="display: none;"></div>
        </div>

        <div class="progress">
            <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
        </div>

        <div style="text-align: center; margin-top: 30px;">
            <button class="btn btn-primary" onclick="resetStats()" style="padding: 15px 30px; font-size: 1.2em;">
                🔄 Reiniciar Progreso
            </button>
        </div>
    </div>

    <script>
        let stats = { score: 0, total: 0 };
        let currentExercise = {};

        // Inicializar
        window.onload = function() {
            loadStats();
            newSuma();
            updateStats();
        };

        function showTab(tabName) {
            document.querySelectorAll('.content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        // === SUMAS ===
        function newSuma() {
            const a = Math.floor(Math.random() * 30) + 1;
            const b = Math.floor(Math.random() * 30) + 1;
            currentExercise = { type: 'suma', a, b, answer: a + b };
            document.getElementById('suma-question').textContent = `${a} + ${b} = ?`;
            document.getElementById('suma-answer').value = '';
            document.getElementById('suma-answer').className = '';
            document.getElementById('suma-steps').style.display = 'none';
        }

        function checkSuma() {
            const userAnswer = parseInt(document.getElementById('suma-answer').value) || 0;
            const input = document.getElementById('suma-answer');
            
            if (userAnswer === currentExercise.answer) {
                input.classList.add('correct');
                stats.score++;
                showSteps('suma');
            } else {
                input.classList.add('wrong');
                input.value = currentExercise.answer;
                showSteps('suma');
            }
            
            stats.total++;
            saveStats();
            updateStats();
        }

        // === RESTAS ===
        function newResta() {
            const total = Math.floor(Math.random() * 50) + 10;
            const b = Math.floor(Math.random() * (total/2)) + 1;
            const a = total - b;
            currentExercise = { type: 'resta', total, b, answer: a };
            document.getElementById('resta-question').textContent = `${total} - ${b} = ?`;
            document.getElementById('resta-answer').value = '';
            document.getElementById('resta-answer').className = '';
            document.getElementById('resta-steps').style.display = 'none';
        }

        function checkResta() {
            const userAnswer = parseInt(document.getElementById('resta-answer').value) || 0;
            const input = document.getElementById('resta-answer');
            
            if (userAnswer === currentExercise.answer) {
                input.classList.add('correct');
                stats.score++;
                showSteps('resta');
            } else {
                input.classList.add('wrong');
                input.value = currentExercise.answer;
                showSteps('resta');
            }
            
            stats.total++;
            saveStats();
            updateStats();
        }

        // === MULTIPLICAR ===
        function newMultiplicar() {
            const a = Math.floor(Math.random() * 10) + 1;
            const b = Math.floor(Math.random() * 10) + 1;
            currentExercise = { type: 'multiplicar', a, b, answer: a * b };
            document.getElementById('multiplicar-question').textContent = `${a} × ${b} = ?`;
            document.getElementById('multiplicar-answer').value = '';
            document.getElementById('multiplicar-answer').className = '';
            document.getElementById('multiplicar-steps').style.display = 'none';
        }

        function checkMultiplicar() {
            const userAnswer = parseInt(document.getElementById('multiplicar-answer').value) || 0;
            const input = document.getElementById('multiplicar-answer');
            
            if (userAnswer === currentExercise.answer) {
                input.classList.add('correct');
                stats.score++;
                showSteps('multiplicar');
            } else {
                input.classList.add('wrong');
                input.value = currentExercise.answer;
                showSteps('multiplicar');
            }
            
            stats.total++;
            saveStats();
            updateStats();
        }

        // === DIVIDIR ===
        function newDividir() {
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            const total = a * b;
            currentExercise = { type: 'dividir', total, b, answer: a };
            document.getElementById('dividir-question').textContent = `${total} ÷ ${b} = ?`;
            document.getElementById('dividir-answer').value = '';
            document.getElementById('dividir-answer').className = '';
            document.getElementById('dividir-steps').style.display = 'none';
        }

        function checkDividir() {
            const userAnswer = parseInt(document.getElementById('dividir-answer').value) || 0;
            const input = document.getElementById('dividir-answer');
            
            if (userAnswer === currentExercise.answer) {
                input.classList.add('correct');
                stats.score++;
                showSteps('dividir');
            } else {
                input.classList.add('wrong');
                input.value = currentExercise.answer;
                showSteps('dividir');
            }
            
            stats.total++;
            saveStats();
            updateStats();
        }

        // === PROCEDIMIENTOS ===
        function showSteps(type) {
            const stepsDiv = document.getElementById(type + '-steps');
            stepsDiv.style.display = 'block';
            
            if (type === 'suma') {
                stepsDiv.innerHTML = `
                    <div class="step">
                        <span class="step-num">1️⃣</span>
                        <span>Suma: ${currentExercise.a} + ${currentExercise.b}</span>
                    </div>
                    <div class="step">
                        <span class="step-num">2️⃣</span>
                        <span>¡Resultado: <strong style="color:#28a745;">${currentExercise.answer}</strong>!</span>
                    </div>
                `;
            } else if (type === 'resta') {
                stepsDiv.innerHTML = `
                    <div class="step">
                        <span class="step-num">1️⃣</span>
                        <span>Resta: ${currentExercise.total} - ${currentExercise.b}</span>
                    </div>
                    <div class="step">
                        <span class="step-num">2️⃣</span>
                        <span>¡Resultado: <strong style="color:#28a745;">${currentExercise.answer}</strong>!</span>
                    </div>
                `;
            } else if (type === 'multiplicar') {
                stepsDiv.innerHTML = `
                    <div class="step">
                        <span class="step-num">1️⃣</span>
                        <span>Multiplica: ${currentExercise.a} × ${currentExercise.b}</span>
                    </div>
                    <div class="step">
                        <span class="step-num">2️⃣</span>
                        <span>¡Resultado: <strong style="color:#28a745;">${currentExercise.answer}</strong>!</span>
                    </div>
                `;
            } else if (type === 'dividir') {
                stepsDiv.innerHTML = `
                    <div class="step">
                        <span class="step-num">1️⃣</span>
                        <span>Divide: ${currentExercise.total} ÷ ${currentExercise.b}</span>
                    </div>
                    <div class="step">
                        <span class="step-num">2️⃣</span>
                        <span>¡Resultado: <strong style="color:#28a745;">${currentExercise.answer}</strong>!</span>
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('score').textContent = stats.score;
            document.getElementById('total').textContent = stats.total;
            const accuracy = stats.total > 0 ? Math.round((stats.score / stats.total) * 100) : 0;
            document.getElementById('accuracy').textContent = accuracy + '%';
            document.getElementById('progress-bar').style.width = accuracy + '%';
        }

        function saveStats() {
            localStorage.setItem('mathStats', JSON.stringify(stats));
        }

        function loadStats() {
            const saved = localStorage.getItem('mathStats');
            if (saved) {
                stats = JSON.parse(saved);
            }
        }

        function resetStats() {
            if (confirm('¿Quieres reiniciar todo tu progreso?')) {
                stats = { score: 0, total: 0 };
                saveStats();
                updateStats();
                newSuma();
                alert('¡Progreso reiniciado! 🎉');
            }
        }
    </script>
</body>
</html>
